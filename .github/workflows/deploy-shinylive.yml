name: Deploy ShinyApp to GitHub Pages (Shinylive)

on:
  push:
    branches:
      - main
    paths:
      - 'ShinyApp/**'
      - 'output/**'
      - 'docs/reports/report_template.html'
      - '.github/workflows/deploy-shinylive.yml'
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment
concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - name: Install system dependencies for spatial packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libgdal-dev libgeos-dev libproj-dev libudunits2-dev

      - name: Install pak and R dependencies
        run: |
          install.packages("pak", repos = "https://r-lib.github.io/p/pak/stable/")
          pak::pkg_install(c(
            "shinylive",
            "httpuv",
            "sf",
            "leaflet",
            "plotly",
            "DT",
            "bslib",
            "bsicons",
            "shinyWidgets",
            "dplyr",
            "tidyr",
            "purrr",
            "rlang",
            "readr",
            "readxl",
            "writexl",
            "stringr",
            "slider",
            "jsonlite"
          ))
        shell: Rscript {0}

      - name: Prepare bundled datasets and lightweight maps
        run: |
          if [ -d "output" ] && [ "$(ls -A output 2>/dev/null)" ]; then
            Rscript ShinyApp/deploy/prepare_bundled_data.R
          else
            echo "Live output/ directory not present in CI; using pre-bundled ShinyApp/data/."
          fi

      - name: Export ShinyApp with Shinylive (webR)
        run: |
          Rscript ShinyApp/deploy/build_shinylive.R --no-prep

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
